<svg xmlns="http://www.w3.org/2000/svg" width="588" height="214" viewBox="0 0 588 214" role="img" aria-label="Paragent: A stateful execution layer for browser agents. Record an agent once, then replay it with no model in the loop.">
<defs>
  <radialGradient id="glow" cx="100%" cy="0%" r="90%"><stop offset="0" stop-color="#7fa7d6" stop-opacity=".22"/><stop offset="1" stop-color="#7fa7d6" stop-opacity="0"/></radialGradient>
  <clipPath id="cl"><rect width="588" height="214" rx="18"/></clipPath>
</defs>
<style>
  .k{font:500 11px 'SF Mono', 'Martian Mono', ui-monospace, Menlo, Consolas, monospace;fill:#7fa7d6;letter-spacing:3px}
  .h{font:italic 400 30px Georgia, 'Times New Roman', serif;fill:#f0eee8;letter-spacing:-.5px}
  .d{font:400 14.5px 'Instrument Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#959ba5}
  .tg{font:500 11px 'SF Mono', 'Martian Mono', ui-monospace, Menlo, Consolas, monospace;fill:#f0eee8}
  .bd{font:600 11px 'SF Mono', 'Martian Mono', ui-monospace, Menlo, Consolas, monospace;fill:#7fa7d6;letter-spacing:1px}
  .st{font:500 12px 'SF Mono', 'Martian Mono', ui-monospace, Menlo, Consolas, monospace;fill:#959ba5}
  .sweep{animation:sw 7s ease-in-out infinite}
  @keyframes sw{0%,60%{transform:translateX(-120px)}100%{transform:translateX(708px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#cl)">
  <rect width="588" height="214" fill="#12171f"/>
  <rect width="588" height="214" fill="url(#glow)"/>
  <rect class="sweep" x="0" y="0" width="60" height="214" fill="#f0eee8" opacity=".035" transform="skewX(-20)"/>
  <text x="28" y="40" class="k">AI AGENTS · DEVTOOLIE</text>
  <text x="28" y="76" class="h">Paragent</text>
  <text x="28" y="108" class="d">A stateful execution layer for browser agents. Record an agent</text><text x="28" y="130" class="d">once, then replay it with no model in the loop.</text>
  <rect x="28" y="168" width="96" height="26" rx="13" fill="none" stroke="#282e35"/><text x="76" y="185" text-anchor="middle" class="tg">TypeScript</text><rect x="132.0" y="168" width="126" height="26" rx="13" fill="none" stroke="#282e35"/><text x="195" y="185" text-anchor="middle" class="tg">Browser agents</text><rect x="265.6" y="168" width="66" height="26" rx="13" fill="none" stroke="#282e35"/><text x="299" y="185" text-anchor="middle" class="tg">Replay</text>
  <rect x="471" y="24" width="89" height="26" rx="13" fill="#7fa7d6" fill-opacity=".14" stroke="#7fa7d6" stroke-opacity=".5"/><text x="516" y="41" text-anchor="middle" class="bd">DEVTOOLIE</text>
  <text x="560" y="194" text-anchor="end" class="st">&#9733; 6</text>
</g>
<rect x=".5" y=".5" width="587" height="213" rx="18" fill="none" stroke="#282e35"/>
</svg>